<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="300" height="360" viewBox="0 0 300 360">
    <defs>
        <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
            <stop offset="0%" stop-color="#4c1205" />
            <stop offset="100%" stop-color="#1a0400" />
        </radialGradient>
        <filter id="glow">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    
    <!-- Base Dark Fantasy Gradient Background -->
    <rect width="100%" height="100%" fill="url(#bgGrad)" />
    
    <!-- Orbiting Rings -->
    <ellipse cx="150" cy="180" rx="170" ry="170" fill="none" stroke="rgba(255, 68, 0, 0.15)" stroke-width="1.8" stroke-dasharray="10 15" opacity="0.05" />
    <ellipse cx="150" cy="180" rx="205" ry="205" fill="none" stroke="rgba(255, 68, 0, 0.15)" stroke-width="1.8" stroke-dasharray="10 15" opacity="0.08" />
    
    <!-- Floating Particles -->
    <circle cx="64" cy="244" r="39" fill="rgba(255, 120, 0, 0.25)" opacity="0.14" />
    <circle cx="211" cy="276" r="23" fill="rgba(255, 120, 0, 0.25)" opacity="0.24" />
    <circle cx="138" cy="245" r="57" fill="rgba(255, 120, 0, 0.25)" opacity="0.18" />
    <circle cx="65" cy="311" r="24" fill="rgba(255, 120, 0, 0.25)" opacity="0.12" />
    <circle cx="102" cy="179" r="57" fill="rgba(255, 120, 0, 0.25)" opacity="0.14" />
    <circle cx="56" cy="163" r="49" fill="rgba(255, 120, 0, 0.25)" opacity="0.24" />
    <circle cx="99" cy="56" r="33" fill="rgba(255, 120, 0, 0.25)" opacity="0.08" />
    <circle cx="165" cy="182" r="17" fill="rgba(255, 120, 0, 0.25)" opacity="0.18" />
    <circle cx="182" cy="58" r="39" fill="rgba(255, 120, 0, 0.25)" opacity="0.1" />
    
    <!-- Outer Sigil Ring borders -->
    <circle cx="150" cy="180" r="100" fill="none" stroke="rgba(255, 80, 0, 0.55)" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.55" />
    <circle cx="150" cy="180" r="88" fill="none" stroke="rgba(255, 80, 0, 0.55)" stroke-width="1.2" opacity="0.38" />

    <!-- Centered Glowing Large Custom Runic Fantasy Seal -->
    <g transform="translate(150, 180) rotate(6) scale(1.26)">
        <!-- Sigil Glow Shadow -->
        <path d="M 0 -60 L 50 25 L -50 25 Z M 0 -42 L 35 17 L -35 17 Z M 0 -25 L 20 8 L -20 8 Z" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" opacity="0.22" />
        <!-- Main Sigil Vector Path -->
        <path d="M 0 -60 L 50 25 L -50 25 Z M 0 -42 L 35 17 L -35 17 Z M 0 -25 L 20 8 L -20 8 Z" fill="none" stroke="rgba(255, 80, 0, 0.55)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.55" />
    </g>
    
    <!-- Monospace spaced parodied name engraving at bottom -->
    <text x="150" y="328" font-family="'Courier New', Courier, monospace" font-size="10.5" font-weight="bold" fill="#ffffff" opacity="0.32" text-anchor="middle" letter-spacing="1">F I R E   D R A K E</text>
</svg>