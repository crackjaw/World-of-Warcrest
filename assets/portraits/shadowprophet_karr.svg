<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="300" height="360" viewBox="0 0 300 360">
    <defs>
        <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
            <stop offset="0%" stop-color="#3d134f" />
            <stop offset="100%" stop-color="#150221" />
        </radialGradient>
        <filter id="glow">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    
    <!-- Base Dark Fantasy Gradient Background -->
    <rect width="100%" height="100%" fill="url(#bgGrad)" />
    
    <!-- Orbiting Rings -->
    <ellipse cx="150" cy="180" rx="170" ry="170" fill="none" stroke="rgba(163, 53, 238, 0.16)" stroke-width="1.8" stroke-dasharray="10 15" opacity="0.05" />
    <ellipse cx="150" cy="180" rx="205" ry="205" fill="none" stroke="rgba(163, 53, 238, 0.16)" stroke-width="1.8" stroke-dasharray="10 15" opacity="0.08" />
    
    <!-- Floating Particles -->
    <circle cx="235" cy="95" r="20" fill="rgba(180, 80, 255, 0.25)" opacity="0.16" />
    <circle cx="144" cy="152" r="31" fill="rgba(180, 80, 255, 0.25)" opacity="0.22" />
    <circle cx="176" cy="89" r="48" fill="rgba(180, 80, 255, 0.25)" opacity="0.14" />
    <circle cx="129" cy="47" r="36" fill="rgba(180, 80, 255, 0.25)" opacity="0.08" />
    <circle cx="173" cy="41" r="61" fill="rgba(180, 80, 255, 0.25)" opacity="0.16" />
    <circle cx="184" cy="251" r="50" fill="rgba(180, 80, 255, 0.25)" opacity="0.06" />
    
    <!-- Outer Sigil Ring borders -->
    <circle cx="150" cy="180" r="115" fill="none" stroke="rgba(255, 209, 0, 0.25)" stroke-width="6" opacity="0.3" filter="url(#glow)" />
    <circle cx="150" cy="180" r="100" fill="none" stroke="rgba(255, 209, 0, 0.6)" stroke-width="2.5" stroke-dasharray="none" opacity="0.55" />
    <circle cx="150" cy="180" r="88" fill="none" stroke="rgba(255, 209, 0, 0.6)" stroke-width="1.2" opacity="0.38" />

    <!-- Centered Glowing Large Custom Runic Fantasy Seal -->
    <g transform="translate(150, 180) rotate(9) scale(1.1)">
        <!-- Sigil Glow Shadow -->
        <path d="M -45 0 A 45 45 0 1 0 45 0 A 35 35 0 1 1 -45 0 M 0 -45 L 0 45 M -45 0 L 45 0" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" opacity="0.22" />
        <!-- Main Sigil Vector Path -->
        <path d="M -45 0 A 45 45 0 1 0 45 0 A 35 35 0 1 1 -45 0 M 0 -45 L 0 45 M -45 0 L 45 0" fill="none" stroke="rgba(163, 53, 238, 0.55)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.55" />
    </g>
    
    <!-- Monospace spaced parodied name engraving at bottom -->
    <text x="150" y="328" font-family="'Courier New', Courier, monospace" font-size="10.5" font-weight="bold" fill="#ffffff" opacity="0.32" text-anchor="middle" letter-spacing="1">S H A D O W P R O P H E T   K A R R</text>
</svg>