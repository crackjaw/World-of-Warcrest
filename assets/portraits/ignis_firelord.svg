<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="300" height="360" viewBox="0 0 300 360">
    <defs>
        <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
            <stop offset="0%" stop-color="#4c1205" />
            <stop offset="100%" stop-color="#1a0400" />
        </radialGradient>
        <filter id="glow">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    
    <!-- Base Dark Fantasy Gradient Background -->
    <rect width="100%" height="100%" fill="url(#bgGrad)" />
    
    <!-- Orbiting Rings -->
    <ellipse cx="150" cy="180" rx="170" ry="170" fill="none" stroke="rgba(255, 68, 0, 0.15)" stroke-width="1.8" stroke-dasharray="10 15" opacity="0.05" />
    <ellipse cx="150" cy="180" rx="205" ry="205" fill="none" stroke="rgba(255, 68, 0, 0.15)" stroke-width="1.8" stroke-dasharray="10 15" opacity="0.08" />
    <ellipse cx="150" cy="180" rx="240" ry="240" fill="none" stroke="rgba(255, 68, 0, 0.15)" stroke-width="1.8" stroke-dasharray="10 15" opacity="0.11" />
    
    <!-- Floating Particles -->
    <circle cx="112" cy="72" r="47" fill="rgba(255, 120, 0, 0.25)" opacity="0.1" />
    <circle cx="168" cy="254" r="42" fill="rgba(255, 120, 0, 0.25)" opacity="0.14" />
    <circle cx="127" cy="102" r="61" fill="rgba(255, 120, 0, 0.25)" opacity="0.24" />
    <circle cx="62" cy="118" r="15" fill="rgba(255, 120, 0, 0.25)" opacity="0.1" />
    <circle cx="156" cy="50" r="56" fill="rgba(255, 120, 0, 0.25)" opacity="0.18" />
    <circle cx="179" cy="182" r="21" fill="rgba(255, 120, 0, 0.25)" opacity="0.08" />
    <circle cx="130" cy="303" r="16" fill="rgba(255, 120, 0, 0.25)" opacity="0.1" />
    
    <!-- Outer Sigil Ring borders -->
    <circle cx="150" cy="180" r="115" fill="none" stroke="rgba(255, 209, 0, 0.25)" stroke-width="6" opacity="0.3" filter="url(#glow)" />
    <circle cx="150" cy="180" r="100" fill="none" stroke="rgba(255, 209, 0, 0.6)" stroke-width="2.5" stroke-dasharray="none" opacity="0.55" />
    <circle cx="150" cy="180" r="88" fill="none" stroke="rgba(255, 209, 0, 0.6)" stroke-width="1.2" opacity="0.38" />

    <!-- Centered Glowing Large Custom Runic Fantasy Seal -->
    <g transform="translate(150, 180) rotate(13) scale(1.34)">
        <!-- Sigil Glow Shadow -->
        <path d="M 0 -60 L 50 25 L -50 25 Z M 0 -42 L 35 17 L -35 17 Z M 0 -25 L 20 8 L -20 8 Z" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" opacity="0.22" />
        <!-- Main Sigil Vector Path -->
        <path d="M 0 -60 L 50 25 L -50 25 Z M 0 -42 L 35 17 L -35 17 Z M 0 -25 L 20 8 L -20 8 Z" fill="none" stroke="rgba(255, 80, 0, 0.55)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.55" />
    </g>
    
    <!-- Monospace spaced parodied name engraving at bottom -->
    <text x="150" y="328" font-family="'Courier New', Courier, monospace" font-size="10.5" font-weight="bold" fill="#ffffff" opacity="0.32" text-anchor="middle" letter-spacing="1">I G N I S   T H E   F I R E L O R D</text>
</svg>