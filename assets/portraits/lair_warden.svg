<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="300" height="360" viewBox="0 0 300 360">
    <defs>
        <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
            <stop offset="0%" stop-color="hsl(34, 35%, 15%)" />
            <stop offset="100%" stop-color="hsl(34, 45%, 6%)" />
        </radialGradient>
        <filter id="glow">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    
    <!-- Base Dark Fantasy Gradient Background -->
    <rect width="100%" height="100%" fill="url(#bgGrad)" />
    
    <!-- Orbiting Rings -->
    <ellipse cx="150" cy="180" rx="170" ry="170" fill="none" stroke="hsla(34, 100%, 50%, 0.14)" stroke-width="1.8" stroke-dasharray="10 15" opacity="0.05" />
    <ellipse cx="150" cy="180" rx="205" ry="205" fill="none" stroke="hsla(34, 100%, 50%, 0.14)" stroke-width="1.8" stroke-dasharray="10 15" opacity="0.08" />
    <ellipse cx="150" cy="180" rx="240" ry="240" fill="none" stroke="hsla(34, 100%, 50%, 0.14)" stroke-width="1.8" stroke-dasharray="10 15" opacity="0.11" />
    
    <!-- Floating Particles -->
    <circle cx="174" cy="274" r="39" fill="hsla(34, 100%, 70%, 0.22)" opacity="0.14" />
    <circle cx="239" cy="140" r="45" fill="hsla(34, 100%, 70%, 0.22)" opacity="0.16" />
    <circle cx="90" cy="88" r="17" fill="hsla(34, 100%, 70%, 0.22)" opacity="0.08" />
    <circle cx="108" cy="221" r="28" fill="hsla(34, 100%, 70%, 0.22)" opacity="0.2" />
    <circle cx="222" cy="133" r="54" fill="hsla(34, 100%, 70%, 0.22)" opacity="0.2" />
    <circle cx="251" cy="297" r="52" fill="hsla(34, 100%, 70%, 0.22)" opacity="0.14" />
    <circle cx="93" cy="108" r="43" fill="hsla(34, 100%, 70%, 0.22)" opacity="0.08" />
    <circle cx="54" cy="259" r="17" fill="hsla(34, 100%, 70%, 0.22)" opacity="0.06" />
    <circle cx="209" cy="68" r="39" fill="hsla(34, 100%, 70%, 0.22)" opacity="0.1" />
    
    <!-- Outer Sigil Ring borders -->
    <circle cx="150" cy="180" r="100" fill="none" stroke="rgba(30, 255, 0, 0.5)" stroke-width="2" stroke-dasharray="10 5" opacity="0.55" />
    <circle cx="150" cy="180" r="88" fill="none" stroke="rgba(30, 255, 0, 0.5)" stroke-width="1.2" opacity="0.38" />

    <!-- Centered Glowing Large Custom Runic Fantasy Seal -->
    <g transform="translate(150, 180) rotate(-6) scale(1.26)">
        <!-- Sigil Glow Shadow -->
        <path d="M 0 -55 L 38 -34 L 38 17 C 38 46 0 63 0 63 C 0 63 -38 46 -38 17 L -38 -34 Z M -38 -34 L 38 17 M 38 -34 L -38 17" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" opacity="0.22" />
        <!-- Main Sigil Vector Path -->
        <path d="M 0 -55 L 38 -34 L 38 17 C 38 46 0 63 0 63 C 0 63 -38 46 -38 17 L -38 -34 Z M -38 -34 L 38 17 M 38 -34 L -38 17" fill="none" stroke="hsla(34, 100%, 70%, 0.55)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.55" />
    </g>
    
    <!-- Monospace spaced parodied name engraving at bottom -->
    <text x="150" y="328" font-family="'Courier New', Courier, monospace" font-size="10.5" font-weight="bold" fill="#ffffff" opacity="0.32" text-anchor="middle" letter-spacing="1">L A I R   W A R D E N</text>
</svg>