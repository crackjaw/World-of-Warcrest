<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="300" height="360" viewBox="0 0 300 360">
    <defs>
        <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
            <stop offset="0%" stop-color="#114529" />
            <stop offset="100%" stop-color="#041b0f" />
        </radialGradient>
        <filter id="glow">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    
    <!-- Base Dark Fantasy Gradient Background -->
    <rect width="100%" height="100%" fill="url(#bgGrad)" />
    
    <!-- Orbiting Rings -->
    <ellipse cx="150" cy="180" rx="170" ry="170" fill="none" stroke="rgba(30, 255, 0, 0.15)" stroke-width="1.8" stroke-dasharray="10 15" opacity="0.05" />
    <ellipse cx="150" cy="180" rx="205" ry="205" fill="none" stroke="rgba(30, 255, 0, 0.15)" stroke-width="1.8" stroke-dasharray="10 15" opacity="0.08" />
    <ellipse cx="150" cy="180" rx="240" ry="240" fill="none" stroke="rgba(30, 255, 0, 0.15)" stroke-width="1.8" stroke-dasharray="10 15" opacity="0.11" />
    <ellipse cx="150" cy="180" rx="275" ry="275" fill="none" stroke="rgba(30, 255, 0, 0.15)" stroke-width="1.8" stroke-dasharray="10 15" opacity="0.14" />
    
    <!-- Floating Particles -->
    <circle cx="84" cy="124" r="59" fill="rgba(80, 255, 80, 0.25)" opacity="0.14" />
    <circle cx="161" cy="191" r="31" fill="rgba(80, 255, 80, 0.25)" opacity="0.22" />
    <circle cx="236" cy="304" r="41" fill="rgba(80, 255, 80, 0.25)" opacity="0.2" />
    <circle cx="144" cy="213" r="42" fill="rgba(80, 255, 80, 0.25)" opacity="0.22" />
    <circle cx="66" cy="97" r="39" fill="rgba(80, 255, 80, 0.25)" opacity="0.08" />
    <circle cx="47" cy="188" r="26" fill="rgba(80, 255, 80, 0.25)" opacity="0.1" />
    <circle cx="97" cy="164" r="29" fill="rgba(80, 255, 80, 0.25)" opacity="0.08" />
    <circle cx="55" cy="266" r="19" fill="rgba(80, 255, 80, 0.25)" opacity="0.08" />
    
    <!-- Outer Sigil Ring borders -->
    <circle cx="150" cy="180" r="100" fill="none" stroke="rgba(30, 255, 0, 0.5)" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.55" />
    <circle cx="150" cy="180" r="88" fill="none" stroke="rgba(30, 255, 0, 0.5)" stroke-width="1.2" opacity="0.38" />

    <!-- Centered Glowing Large Custom Runic Fantasy Seal -->
    <g transform="translate(150, 180) rotate(6) scale(1.1)">
        <!-- Sigil Glow Shadow -->
        <path d="M 0 -60 C 30 -30 38 8 0 50 C -30 8 -28 -30 0 -60 M 0 -60 L 0 50 M -25 -8 Q 0 -15 25 -8" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" opacity="0.22" />
        <!-- Main Sigil Vector Path -->
        <path d="M 0 -60 C 30 -30 38 8 0 50 C -30 8 -28 -30 0 -60 M 0 -60 L 0 50 M -25 -8 Q 0 -15 25 -8" fill="none" stroke="rgba(30, 255, 0, 0.5)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.55" />
    </g>
    
    <!-- Monospace spaced parodied name engraving at bottom -->
    <text x="150" y="328" font-family="'Courier New', Courier, monospace" font-size="10.5" font-weight="bold" fill="#ffffff" opacity="0.32" text-anchor="middle" letter-spacing="1">P I R A T E   B U C C A N E E R</text>
</svg>