<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="300" height="360" viewBox="0 0 300 360">
    <defs>
        <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
            <stop offset="0%" stop-color="hsl(106, 35%, 15%)" />
            <stop offset="100%" stop-color="hsl(106, 45%, 6%)" />
        </radialGradient>
        <filter id="glow">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    
    <!-- Base Dark Fantasy Gradient Background -->
    <rect width="100%" height="100%" fill="url(#bgGrad)" />
    
    <!-- Orbiting Rings -->
    <ellipse cx="150" cy="180" rx="170" ry="170" fill="none" stroke="hsla(106, 100%, 50%, 0.14)" stroke-width="1.8" stroke-dasharray="10 15" opacity="0.05" />
    <ellipse cx="150" cy="180" rx="205" ry="205" fill="none" stroke="hsla(106, 100%, 50%, 0.14)" stroke-width="1.8" stroke-dasharray="10 15" opacity="0.08" />
    <ellipse cx="150" cy="180" rx="240" ry="240" fill="none" stroke="hsla(106, 100%, 50%, 0.14)" stroke-width="1.8" stroke-dasharray="10 15" opacity="0.11" />
    
    <!-- Floating Particles -->
    <circle cx="186" cy="266" r="31" fill="hsla(106, 100%, 70%, 0.22)" opacity="0.18" />
    <circle cx="187" cy="244" r="57" fill="hsla(106, 100%, 70%, 0.22)" opacity="0.08" />
    <circle cx="242" cy="66" r="62" fill="hsla(106, 100%, 70%, 0.22)" opacity="0.16" />
    <circle cx="146" cy="149" r="34" fill="hsla(106, 100%, 70%, 0.22)" opacity="0.2" />
    <circle cx="177" cy="89" r="64" fill="hsla(106, 100%, 70%, 0.22)" opacity="0.22" />
    <circle cx="75" cy="117" r="53" fill="hsla(106, 100%, 70%, 0.22)" opacity="0.14" />
    
    <!-- Outer Sigil Ring borders -->
    <circle cx="150" cy="180" r="100" fill="none" stroke="hsla(106, 100%, 70%, 0.55)" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.55" />
    <circle cx="150" cy="180" r="88" fill="none" stroke="hsla(106, 100%, 70%, 0.55)" stroke-width="1.2" opacity="0.38" />

    <!-- Centered Glowing Large Custom Runic Fantasy Seal -->
    <g transform="translate(150, 180) rotate(12) scale(1.26)">
        <!-- Sigil Glow Shadow -->
        <path d="M 0 -55 L 38 -34 L 38 17 C 38 46 0 63 0 63 C 0 63 -38 46 -38 17 L -38 -34 Z M -38 -34 L 38 17 M 38 -34 L -38 17" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" opacity="0.22" />
        <!-- Main Sigil Vector Path -->
        <path d="M 0 -55 L 38 -34 L 38 17 C 38 46 0 63 0 63 C 0 63 -38 46 -38 17 L -38 -34 Z M -38 -34 L 38 17 M 38 -34 L -38 17" fill="none" stroke="hsla(106, 100%, 70%, 0.55)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.55" />
    </g>
    
    <!-- Monospace spaced parodied name engraving at bottom -->
    <text x="150" y="328" font-family="'Courier New', Courier, monospace" font-size="10.5" font-weight="bold" fill="#ffffff" opacity="0.32" text-anchor="middle" letter-spacing="1">L A V A   G I A N T</text>
</svg>