<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="300" height="360" viewBox="0 0 300 360">
    <defs>
        <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
            <stop offset="0%" stop-color="#0c3559" />
            <stop offset="100%" stop-color="#03172b" />
        </radialGradient>
        <filter id="glow">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    
    <!-- Base Dark Fantasy Gradient Background -->
    <rect width="100%" height="100%" fill="url(#bgGrad)" />
    
    <!-- Orbiting Rings -->
    <ellipse cx="150" cy="180" rx="170" ry="170" fill="none" stroke="rgba(0, 150, 255, 0.18)" stroke-width="1.8" stroke-dasharray="10 15" opacity="0.05" />
    <ellipse cx="150" cy="180" rx="205" ry="205" fill="none" stroke="rgba(0, 150, 255, 0.18)" stroke-width="1.8" stroke-dasharray="10 15" opacity="0.08" />
    <ellipse cx="150" cy="180" rx="240" ry="240" fill="none" stroke="rgba(0, 150, 255, 0.18)" stroke-width="1.8" stroke-dasharray="10 15" opacity="0.11" />
    <ellipse cx="150" cy="180" rx="275" ry="275" fill="none" stroke="rgba(0, 150, 255, 0.18)" stroke-width="1.8" stroke-dasharray="10 15" opacity="0.14" />
    
    <!-- Floating Particles -->
    <circle cx="182" cy="242" r="47" fill="rgba(100, 200, 255, 0.28)" opacity="0.1" />
    <circle cx="240" cy="240" r="45" fill="rgba(100, 200, 255, 0.28)" opacity="0.06" />
    <circle cx="200" cy="65" r="51" fill="rgba(100, 200, 255, 0.28)" opacity="0.24" />
    <circle cx="245" cy="218" r="17" fill="rgba(100, 200, 255, 0.28)" opacity="0.14" />
    <circle cx="256" cy="272" r="62" fill="rgba(100, 200, 255, 0.28)" opacity="0.18" />
    <circle cx="149" cy="174" r="61" fill="rgba(100, 200, 255, 0.28)" opacity="0.18" />
    <circle cx="232" cy="266" r="27" fill="rgba(100, 200, 255, 0.28)" opacity="0.06" />
    <circle cx="88" cy="138" r="15" fill="rgba(100, 200, 255, 0.28)" opacity="0.06" />
    
    <!-- Outer Sigil Ring borders -->
    <circle cx="150" cy="180" r="100" fill="none" stroke="rgba(0, 180, 255, 0.65)" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.55" />
    <circle cx="150" cy="180" r="88" fill="none" stroke="rgba(0, 180, 255, 0.65)" stroke-width="1.2" opacity="0.38" />

    <!-- Centered Glowing Large Custom Runic Fantasy Seal -->
    <g transform="translate(150, 180) rotate(5) scale(1.1)">
        <!-- Sigil Glow Shadow -->
        <path d="M 0 0 L 18 0 M 18 0 L 55 0 M 38 10 L 38 -10 M 0 0 L 9 16 M 9 16 L 28 48 M 10 38 L 28 28 M 0 0 L -9 16 M -9 16 L -27 48 M -28 28 L -10 38 M 0 0 L -18 0 M -18 0 L -55 0 M -38 -10 L -38 10 M 0 0 L -9 -16 M -9 -16 L -28 -48 M -10 -38 L -28 -28 M 0 0 L 9 -16 M 9 -16 L 28 -48 M 28 -28 L 10 -38 " fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" opacity="0.22" />
        <!-- Main Sigil Vector Path -->
        <path d="M 0 0 L 18 0 M 18 0 L 55 0 M 38 10 L 38 -10 M 0 0 L 9 16 M 9 16 L 28 48 M 10 38 L 28 28 M 0 0 L -9 16 M -9 16 L -27 48 M -28 28 L -10 38 M 0 0 L -18 0 M -18 0 L -55 0 M -38 -10 L -38 10 M 0 0 L -9 -16 M -9 -16 L -28 -48 M -10 -38 L -28 -28 M 0 0 L 9 -16 M 9 -16 L 28 -48 M 28 -28 L 10 -38 " fill="none" stroke="rgba(0, 180, 255, 0.65)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.55" />
    </g>
    
    <!-- Monospace spaced parodied name engraving at bottom -->
    <text x="150" y="328" font-family="'Courier New', Courier, monospace" font-size="10.5" font-weight="bold" fill="#ffffff" opacity="0.32" text-anchor="middle" letter-spacing="1">F R O S T   S A B E R T O O T H</text>
</svg>