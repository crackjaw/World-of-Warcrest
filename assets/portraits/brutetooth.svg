<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="300" height="360" viewBox="0 0 300 360">
    <defs>
        <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
            <stop offset="0%" stop-color="hsl(182, 35%, 15%)" />
            <stop offset="100%" stop-color="hsl(182, 45%, 6%)" />
        </radialGradient>
        <filter id="glow">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    
    <!-- Base Dark Fantasy Gradient Background -->
    <rect width="100%" height="100%" fill="url(#bgGrad)" />
    
    <!-- Orbiting Rings -->
    <ellipse cx="150" cy="180" rx="170" ry="170" fill="none" stroke="hsla(182, 100%, 50%, 0.14)" stroke-width="1.8" stroke-dasharray="10 15" opacity="0.05" />
    <ellipse cx="150" cy="180" rx="205" ry="205" fill="none" stroke="hsla(182, 100%, 50%, 0.14)" stroke-width="1.8" stroke-dasharray="10 15" opacity="0.08" />
    <ellipse cx="150" cy="180" rx="240" ry="240" fill="none" stroke="hsla(182, 100%, 50%, 0.14)" stroke-width="1.8" stroke-dasharray="10 15" opacity="0.11" />
    <ellipse cx="150" cy="180" rx="275" ry="275" fill="none" stroke="hsla(182, 100%, 50%, 0.14)" stroke-width="1.8" stroke-dasharray="10 15" opacity="0.14" />
    
    <!-- Floating Particles -->
    <circle cx="122" cy="102" r="57" fill="hsla(182, 100%, 70%, 0.22)" opacity="0.1" />
    <circle cx="116" cy="258" r="24" fill="hsla(182, 100%, 70%, 0.22)" opacity="0.16" />
    <circle cx="169" cy="68" r="22" fill="hsla(182, 100%, 70%, 0.22)" opacity="0.1" />
    <circle cx="128" cy="44" r="16" fill="hsla(182, 100%, 70%, 0.22)" opacity="0.1" />
    <circle cx="227" cy="251" r="56" fill="hsla(182, 100%, 70%, 0.22)" opacity="0.14" />
    <circle cx="142" cy="242" r="49" fill="hsla(182, 100%, 70%, 0.22)" opacity="0.08" />
    <circle cx="231" cy="136" r="46" fill="hsla(182, 100%, 70%, 0.22)" opacity="0.1" />
    
    <!-- Outer Sigil Ring borders -->
    <circle cx="150" cy="180" r="115" fill="none" stroke="rgba(255, 209, 0, 0.25)" stroke-width="6" opacity="0.3" filter="url(#glow)" />
    <circle cx="150" cy="180" r="100" fill="none" stroke="rgba(255, 209, 0, 0.6)" stroke-width="2.5" stroke-dasharray="none" opacity="0.55" />
    <circle cx="150" cy="180" r="88" fill="none" stroke="rgba(255, 209, 0, 0.6)" stroke-width="1.2" opacity="0.38" />

    <!-- Centered Glowing Large Custom Runic Fantasy Seal -->
    <g transform="translate(150, 180) rotate(1) scale(1.1800000000000002)">
        <!-- Sigil Glow Shadow -->
        <path d="M 0 -55 L 38 -34 L 38 17 C 38 46 0 63 0 63 C 0 63 -38 46 -38 17 L -38 -34 Z M -38 -34 L 38 17 M 38 -34 L -38 17" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" opacity="0.22" />
        <!-- Main Sigil Vector Path -->
        <path d="M 0 -55 L 38 -34 L 38 17 C 38 46 0 63 0 63 C 0 63 -38 46 -38 17 L -38 -34 Z M -38 -34 L 38 17 M 38 -34 L -38 17" fill="none" stroke="hsla(182, 100%, 70%, 0.55)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.55" />
    </g>
    
    <!-- Monospace spaced parodied name engraving at bottom -->
    <text x="150" y="328" font-family="'Courier New', Courier, monospace" font-size="10.5" font-weight="bold" fill="#ffffff" opacity="0.32" text-anchor="middle" letter-spacing="1">B R U T E T O O T H</text>
</svg>